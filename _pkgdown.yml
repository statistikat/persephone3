url: https://statistikat.github.io/persephone3/

template:
  bootstrap: 5
  bootswatch: flatly

code:
  width: 70

development:
  mode: auto

authors:
  sidebar:
    roles: [aut, ctb]
  Angelika Meraner:
    href: https://github.com/merangelik
  Alexander Kowarik:
    href: https://github.com/alexkowa
  Markus Fröhlich:
    href: https://github.com/froehmar
  Gregor de Cillia:
    role: ctb

navbar:
  type: default
  left:
  - text: Manual
    icon: fas fa-book
    href: reference/
  - text: Quickstart
    icon: fas fa-bolt
    href: articles/persephone3.html
  - text: Plots
    icon: fas fa-chart-line
    href: articles/persephone-plotting.html
  - text: Hierarchies
    icon: fas fa-layer-group
    href: articles/persephone-hierarchical.html
  - text: News
    icon: fas fa-newspaper
    href: news/
  right:
  - icon: fas fa-github fa-lg
    href: https://github.com/statistikat/persephone3
    aria-label: github

reference:
  - title: "Main Functions"
    contents:
      - starts_with("per")
  - title: "Dashboard"
    contents:
      - starts_with("dashboard")

articles:
  - title: "User Guides"
    navbar: ~
    contents:
      - persephone3
      - persephone-plotting
      - persephone-hierarchical
      - persephone-hierarchicalEU
