on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PERSEPHONE_REQUIRE_ORACLE: 'true'
      # Oracle lane pass A for the coverage run (x86-64 domain partition:
      # R/helpers.R); the bridge-domain files run in the required step below.
      PERSEPHONE_ORACLE_PASS: 'default'
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-3-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-3-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libprotobuf-dev \
            protobuf-compiler \
            libprotoc-dev \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install RProtoBuf
        if: runner.os == 'Linux'
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y
        shell: pwsh

      - name: Install RProtoBuf
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "covr", "tinytest"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          covr::codecov(
            error = TRUE,
            quiet = FALSE
          )
        shell: Rscript {0}

      - name: Oracle bridge-domain pass (x86-64)
        if: runner.arch == 'X64'
        env:
          JAVA_TOOL_OPTIONS: "-XX:+UnlockDiagnosticVMOptions -XX:DisableIntrinsic=_dexp,_dlog"
        run: |
          Rscript -e 'remotes::install_local(".", upgrade = "never", force = TRUE, dependencies = FALSE)'
          Rscript tools/run-oracle-bridge-pass.R
        shell: bash
