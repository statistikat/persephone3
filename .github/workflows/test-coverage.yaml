on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PERSEPHONE_REQUIRE_ORACLE: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libprotobuf-dev \
            protobuf-compiler \
            libprotoc-dev \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install RProtoBuf
        if: runner.os == 'Linux'
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y
        shell: pwsh

      - name: Install RProtoBuf
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "covr", "tinytest"))
          # Install rjd3 packages from GitHub first (pinned to the qualified
          # rjd3 release tags, JVM 21 jars; see Java policy in README/NEWS)
          remotes::install_github("rjdverse/rjd3toolkit@v3.9.1", upgrade = "never")
          remotes::install_github("rjdverse/rjd3tramoseats@v3.9.0", upgrade = "never")
          remotes::install_github("rjdverse/rjd3x13@v3.9.0", upgrade = "never")
          remotes::install_deps(dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          covr::codecov(
            error = TRUE,
            quiet = FALSE
          )
        shell: Rscript {0}
