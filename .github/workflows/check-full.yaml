# NOTE: This workflow is overkill for most R packages
# check-standard.yaml is likely a better choice
# usethis::use_github_action("check-standard") will install it.
#
# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PERSEPHONE_REQUIRE_ORACLE: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os == 'Linux' && matrix.config.r == 'release'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libprotobuf-dev \
            protobuf-compiler \
            libprotoc-dev \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "22.04"))')

      - name: Install RProtoBuf
        if: runner.os == 'Linux'
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y
        shell: pwsh

      - name: Install RProtoBuf
        run: |
          install.packages("RProtoBuf")
        shell: Rscript {0}

      # The native engine (rkalos, built from the pinned Remotes source below)
      # links the OpenBLAS provider pinned in the kalos lockfile (0.3.34),
      # mirroring kalos core.yml; Windows keeps the Rtools-supplied OpenBLAS
      # that rkalos' configure detects there.
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Build tools for the pinned OpenBLAS provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build
      - name: Build tools for the pinned OpenBLAS provider (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc cmake ninja libomp
      - name: Fetch the pinned provider tooling (kalos core pin)
        if: runner.os != 'Windows'
        uses: actions/checkout@v5
        with:
          repository: statistikat/kalos
          ref: f500162a3be1539803566f9bc8f071e0deb4f66b
          path: .kalos-provider
      - name: Build pinned OpenBLAS provider
        if: runner.os != 'Windows'
        run: python .kalos-provider/tools/build-openblas.py --prefix "${{ runner.temp }}/openblas" --jobs 2
      - name: Point the rkalos source build at the pinned provider
        if: runner.os != 'Windows'
        run: echo "KALOS_OPENBLAS_ROOT=${{ runner.temp }}/openblas" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # Install GitHub dependencies first (pinned to the qualified rjd3 release
          # tags, JVM 21 jars; bump together with the Java policy in README/NEWS)
          remotes::install_github("rjdverse/rjd3toolkit@v3.9.1", upgrade = "never")
          remotes::install_github("rjdverse/rjd3tramoseats@v3.9.0", upgrade = "never")
          remotes::install_github("rjdverse/rjd3x13@v3.9.0", upgrade = "never")
          remotes::install_deps(dependencies = TRUE)
          remotes::install_cran("rcmdcheck")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check
        env:
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_FORCE_SUGGESTS_: true
        run: |
          options(crayon.enabled = TRUE)
          manual <- identical(Sys.getenv("RUNNER_OS"), "Linux") && identical("${{ matrix.config.r }}", "release")
          args <- c(if (!manual) "--no-manual", "--as-cran")
          rcmdcheck::rcmdcheck(args = args, error_on = "warning", check_dir = "check")
        shell: Rscript {0}

      - name: Show tinytest output
        if: always()
        run: find check -name 'tinytest.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
